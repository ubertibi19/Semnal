name: Collect news

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
  push:
    paths:
      - scripts/collect.py
      - .github/workflows/collect.yml

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update news.json from outlet feeds
        run: python3 scripts/collect.py
      - name: Commit and push
        run: |
          git config user.name "semnal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Hourly news update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
