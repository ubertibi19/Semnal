<style>
/* Layout: sticky header with region + language switch; main feed column + trending rail (rail becomes a strip on phones). Heat = number of independent sources. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#dde3e8;
  --accent:#0b5d7a; --accent-soft:#e1eef3; --heat:#d9761a; --heat-soft:#fbeedd; --alert-bg:#14212b; --alert-fg:#f3f5f7;

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#16222b; --ink:#e6edf1; --muted:#93a4b0; --line:#26343e;
  --accent:#5fb6d4; --accent-soft:#17323d; --heat:#f0a052; --heat-soft:#3a2a18; --alert-bg:#e6edf1; --alert-fg:#0e161c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16222b; --ink:#e6edf1; --muted:#93a4b0; --line:#26343e;
  --accent:#5fb6d4; --accent-soft:#17323d; --heat:#f0a052; --heat-soft:#3a2a18; --alert-bg:#e6edf1; --alert-fg:#0e161c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:26px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--heat);box-shadow:0 0 0 4px var(--heat-soft)}
.region{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-family:var(--f-mono);font-size:12px;font-weight:500;border:none;background:var(--bg);color:var(--muted);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live{width:8px;height:8px;border-radius:50%;background:#2e9e5b}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alert{background:var(--alert-bg);color:var(--alert-fg);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;margin-top:16px}
.alert .bell{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--heat);color:#1a1006;border-radius:6px;padding:3px 7px;white-space:nowrap}
.alert h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:18px;line-height:1.25;text-wrap:balance}
.alert p{margin:4px 0 0;font-size:13px;opacity:.8}

main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding-block:20px 48px}
.sectionlabel{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.feed{display:flex;flex-direction:column;gap:12px;min-width:0}

.count{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--heat-soft);color:var(--heat);border-radius:6px;padding:3px 7px}
.count.one{background:var(--bg);color:var(--muted)}
aside{min-width:0}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.trend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.trend li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.rank{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;color:var(--heat)}
.trend a{text-decoration:none;font-weight:600;font-size:14px;line-height:1.3;display:block}
.trend a:hover{color:var(--accent)}
.heat{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.heat i{display:block;height:100%;background:var(--heat);border-radius:2px}
.trend small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font:inherit;font-size:12px;border:none;background:var(--bg);color:var(--muted);border-radius:6px;padding:4px 9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding-block:6px}
.setting + .setting{border-top:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:4px}
.changes{padding-block:0 56px;max-width:760px}
.log{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.log li{position:relative;padding-left:18px}
.log li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.log li:first-child::before{background:var(--accent)}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block}
.log b{font-weight:600}
.log p{margin:2px 0 0;color:var(--ink);opacity:.86;max-width:65ch}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  aside{order:-1}
  .rail{position:static}
  .panel.settings{display:none}
  .trend{flex-direction:row;overflow-x:auto;gap:12px;scrollbar-width:none}
  .trend li{flex:0 0 230px}
}
@media (max-width:520px){.status{width:100%}.alert{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.live{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}

"Israelienii votează la primele alegeri generale de după atacurile din 7 octombrie, fără un favorit clar între Netanyahu și fostul șef al armatei Gadi Eisenkot. Prezența de la prânz este cea mai mare din 1973; Netanyahu își acuză adversarii arabi că vor să fure alegerile.", "title": "Israel votes in tight Netanyahu–Eisenkot race", "title_ro": "Israelul votează într-o cursă strânsă Netanyahu–Eisenkot", "topic": "politics", "id": "world-israel-election"}, {"place": "Paris", "place_ro": "Paris", "publishedAt": "2026-10-27T06:30:00Z", "region": "world", "sources": [{"name": "Euronews", "url": "https://www.euronews.com/2026/10/27/harry-kane-is-first-bundesliga-player-since-matthias-sammer-to-win-ballon-dor"}], "summary": "The Bayern Munich striker is the first English winner in 25 years.", "summary_ro": "Atacantul lui Bayern München este primul englez premiat după 25 de ani.", "title": "Harry Kane wins the Ballon d'Or", "title_ro": "Harry Kane câștigă Balonul de Aur", "topic": "sport", "id": "world-kane-ballon"}, {"place": "United States", "place_ro": "Statele Unite", "publishedAt": "2026-10-27T09:30:00Z", "region": "world", "sources": [{"name": "Euronews", "url": "https://www.euronews.com/2026/10/27/star-trek-actor-walter-koenig-who-played-pavel-chekov-dies-aged-90"}], "summary": "Koenig was best known for playing Pavel Chekov in the original series and films.", "summary_ro": "Koenig era cunoscut mai ales pentru rolul lui Pavel Chekov din serialul original și din filme.", "title": "Star Trek actor Walter Koenig dies at 90", "title_ro": "Actorul din Star Trek Walter Koenig a murit la 90 de ani", "topic": "culture", "id": "world-koenig"}, {"place": "South Korea", "place_ro": "Coreea de Sud", "publishedAt": "2026-10-27T06:00:00Z", "region": "world", "sources": [{"name": "Euronews", "url": "https://www.euronews.com/2026/10/27/ai-chip-boom-tripled-south-koreas-economic-growth-in-the-third-quarter"}], "summary": "Strong chip exports tripled the country's economic growth rate in the third quarter.", "summary_ro": "Exporturile puternice de cipuri au triplat ritmul de creștere economică în trimestrul al treilea.", "title": "AI chip demand lifts South Korea's growth", "title_ro": "Cererea de cipuri AI accelerează creșterea Coreei de Sud", "topic": "economy", "id": "world-korea-growth"}, {"place": "France", "place_ro": "Franța", "publishedAt": "2026-10-27T10:30:00Z", "region": "world", "sources": [{"name": "Euronews", "url": "https://www.euronews.com/2026/10/27/scientists-uncover-new-clues-to-the-actual-night-sky-behind-van-goghs-the-starry-night"}], "summary": "New research looks at whether a real astronomical event inspired Van Gogh's painting.", "summary_ro": "Un nou studiu analizează dacă un fenomen astronomic real l-a inspirat pe Van Gogh.", "title": "Scientists trace the real sky behind 'The Starry Night'", "title_ro": "Cercetătorii caută cerul real din „Noaptea înstelată”", "topic": "culture", "id": "world-starry-night"}], "changelog": [{"id": "c1", "at": "2026-10-27T13:23:00Z", "title": "Semnal launched", "title_ro": "Semnal a fost lansat", "text": "News website with a feed chosen by region, trending stories ranked by number of outlets, and breaking-news alerts confirmed by 2+ outlets.", "text_ro": "Site de știri cu flux ales după regiune, știri în tendințe clasate după numărul de publicații și alerte confirmate de minimum 2 surse."}, {"id": "c2", "at": "2026-10-27T13:26:00Z", "title": "Automatic hourly updates", "title_ro": "Actualizare automată în fiecare oră", "text": "New stories are collected from trusted outlets every hour with no manual approval.", "text_ro": "Știrile noi sunt colectate din surse de încredere în fiecare oră, fără aprobare manuală."}, {"id": "c3", "at": "2026-10-27T13:28:00Z", "title": "Romanian language", "title_ro": "Limba română", "text": "RO / EN switch. Every story now has a Romanian title and summary.", "text_ro": "Comutator RO / EN. Fiecare știre are acum titlu și rezumat în română."}, {"id": "c4", "at": "2026-10-27T13:33:00Z", "title": "More politics", "title_ro": "Mai multă politică", "text": "At least half of each update is politics, mostly Romanian. Added Știri pe surse, Digi24, Mediafax, News.ro, Gândul, Capital, B1 TV and CanCan (CanCan never confirms an alert on its own).", "text_ro": "Cel puțin jumătate din fiecare actualizare este politică, mai ales românească. Am adăugat Știri pe surse, Digi24, Mediafax, News.ro, Gândul, Capital, B1 TV și CanCan (CanCan nu confirmă singur o alertă)."}, {"id": "c5", "at": "2026-10-27T13:35:00Z", "title": "New sources", "title_ro": "Surse noi", "text": "Added Recorder, Context, PressOne, Știrile ProTV, Libertatea and Ziarul Financiar; HotNews, Europa Liberă and Agerpres are now checked directly.", "text_ro": "Am adăugat Recorder, Context, PressOne, Știrile ProTV, Libertatea și Ziarul Financiar; HotNews, Europa Liberă și Agerpres sunt verificate direct."}, {"id": "c6", "at": "2026-10-27T13:40:00Z", "title": "Public test link", "title_ro": "Link public de test", "text": "The page now carries a copy of the latest news, so it opens on any phone, even without a Claude account. This list shows what changed.", "text_ro": "Pagina conține acum o copie a ultimelor știri, deci se deschide pe orice telefon, chiar și fără cont Claude. Această listă arată ce s-a schimbat."}, {"id": "c7", "at": "2026-10-27T13:43:00Z", "title": "Trending per region fixed", "title_ro": "Tendințe pe regiuni, reparate", "text": "The Romania, Europe and World tabs now each show only that region's top stories.", "text_ro": "Taburile România, Europa și Lume arată acum doar știrile de top din regiunea respectivă."}]}</script>
<script>
(() => {
  const T = {
    en: {
      newsFor:"News for", trending:"Trending", bySources:"by sources", alertsTitle:"Alerts",
      alertsToggle:"Breaking-news alerts", alertsCap:"Max alerts per day",
      alertsNote:"An alert fires only when at least two independent outlets report the same story in your region.",
      regions:{bucharest:"Bucharest",romania:"Romania",europe:"Europe",world:"World"},
      topics:{all:"All topics",politics:"Politics",security:"Security",economy:"Economy",energy:"Energy",tech:"Tech",culture:"Culture",sport:"Sport",world:"World"},
      forYou:"For you", important:"Top story", stories:n=>`${n} stories`, sources:n=>`${n} source${n===1?"":"s"}`,
      min:n=>`${n} min ago`, hrs:n=>`${n} h ago`, days:n=>`${n} d ago`,
      alert:"Alert", confirmed:n=>`Confirmed by ${n} independent outlets`, dismiss:"Dismiss",
      loadingT:"Loading today's stories", loadingB:"New stories from trusted outlets appear here automatically, picked for the region you choose above.",
      noTopicT:"Nothing in this topic yet", noTopicB:"Try another topic or region. The feed refreshes on its own every hour.",
      noneT:"No stories yet", noneB:"The automatic collector fills this feed from trusted outlets every hour.",
      noTrend:r=>`No trending stories in ${r} right now.`,
      connecting:"Connecting to the live feed…", unavailable:"Live feed unavailable in this view",
      disconnected:"Live feed disconnected. Reload to retry.", waiting:"Waiting for the first update", updated:"Updated", locale:"en-GB",
      changesTitle:"Project updates", changesSub:"what's new in Semnal"
    },
    ro: {
      newsFor:"Știri pentru", trending:"În tendințe", bySources:"după surse", alertsTitle:"Alerte",
      alertsToggle:"Alerte de ultimă oră", alertsCap:"Maximum de alerte pe zi",
      alertsNote:"O alertă apare doar când cel puțin două publicații independente relatează aceeași știre din regiunea ta.",
      regions:{bucharest:"București",romania:"România",europe:"Europa",world:"Lume"},
      topics:{all:"Toate temele",politics:"Politică",security:"Securitate",economy:"Economie",energy:"Energie",tech:"Tehnologie",culture:"Cultură",sport:"Sport",world:"Lume"},
      forYou:"Pentru tine", important:"Știre importantă", stories:n=>`${n} ${n===1?"știre":"știri"}`, sources:n=>`${n} ${n===1?"sursă":"surse"}`,
      min:n=>`acum ${n} min`, hrs:n=>`acum ${n} h`, days:n=>`acum ${n} ${n===1?"zi":"zile"}`,
      alert:"Alertă", confirmed:n=>`Confirmată de ${n} publicații independente`, dismiss:"Închide",
      loadingT:"Se încarcă știrile zilei", loadingB:"Știrile noi din surse de încredere apar aici automat, alese pentru regiunea selectată mai sus.",
      noTopicT:"Nicio știre pe această temă încă", noTopicB:"Încearcă altă temă sau regiune. Fluxul se actualizează singur în fiecare oră.",
      noneT:"Nicio știre încă", noneB:"Colectorul automat adaugă știri din surse de încredere în fiecare oră.",
      noTrend:r=>`Nicio știre în tendințe pentru ${r} acum.`,
      connecting:"Conectare la fluxul live…", unavailable:"Fluxul live nu e disponibil aici",
      disconnected:"Fluxul live s-a deconectat. Reîncarcă pagina.", waiting:"Se așteaptă prima actualizare", updated:"Actualizat", locale:"ro-RO",
      changesTitle:"Noutăți despre proiect", changesSub:"ce s-a schimbat în Semnal"
    }
  };
  const PARENT = {bucharest:"romania", romania:"europe", europe:"world", world:null};
  const TOPICS = ["all","politics","security","economy","energy","tech","culture","sport","world"];
  const store = {
    get(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  const chain = r => { const out=[]; while(r){out.push(r); r=PARENT[r];} return out; };
  const inRegion = (s,r) => chain(s.region||"world").includes(r);
  const visibleFor = (s,r) => chain(r).includes(s.region||"world");
  // Trending is per region: Romania (incl. Bucharest), Europe and World each show only their own stories.
  const trendMatch = (s,r) => r==="romania" ? ["bucharest","romania"].includes(s.region) : (s.region||"world")===r;

  let tz=""; try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  function detectRegion(){
    const saved = store.get("semnal.region"); if (saved && PARENT.hasOwnProperty(saved)) return saved;
    if (tz==="Europe/Bucharest") return "bucharest";
    if (tz.startsWith("Europe/")) return "europe";
    return "world";
  }
  function detectLang(){
    const saved = store.get("semnal.lang"); if (saved==="ro"||saved==="en") return saved;
    const langs = (navigator.languages||[navigator.language||""]).join(",").toLowerCase();
    return (langs.startsWith("ro") || tz==="Europe/Bucharest" || tz==="Europe/Chisinau") ? "ro" : "en";
  }
  let region = detectRegion(), lang = detectLang(), topic = "all";
  let trendRegion = region === "bucharest" ? "romania" : region;
  let stories = [], loaded = false, statusKey = "connecting", lastRun = null, changelog = [];
  // A copy of the feed is saved inside the page every hour, so visitors who are not signed in still see the news.
  try {
    const snap = JSON.parse(document.getElementById("snapshot").textContent);
    if (Array.isArray(snap.stories) && snap.stories.length){ stories = snap.stories; loaded = true; }
    if (snap.lastRun) lastRun = snap.lastRun;
    if (Array.isArray(snap.changelog)) changelog = snap.changelog;
  } catch(e) {}
  const t = () => T[lang];

  const $ = id => document.getElementById(id);
  $("region").value = region;
  $("region").addEventListener("change", e => { region = e.target.value; store.set("semnal.region", region); trendRegion = region==="bucharest"?"romania":region; render(); });
  document.querySelector(".lang").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; lang=b.dataset.l; store.set("semnal.lang", lang); applyStatic(); render(); });
  $("chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; topic=b.dataset.t; render(); });
  $("trendtabs").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; trendRegion=b.dataset.r; render(); });

  $("alerts").checked = store.get("semnal.alerts") !== "off";
  $("alerts").addEventListener("change", e => { store.set("semnal.alerts", e.target.checked?"on":"off"); render(); });
  const cap = store.get("semnal.cap"); if (cap) $("cap").value = cap;
  $("cap").addEventListener("change", e => { store.set("semnal.cap", e.target.value); render(); });

  function applyStatic(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t()[el.dataset.i18n]; });
    [...$("region").options].forEach(o => o.textContent = t().regions[o.value]);
    $("lang-ro").setAttribute("aria-pressed", lang==="ro"); $("lang-en").setAttribute("aria-pressed", lang==="en");
    renderStatus();
  }
  function renderStatus(){
    if (lastRun){
      $("status").textContent = t().updated + " " + new Date(lastRun).toLocaleString(t().locale, {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    } else $("status").textContent = t()[statusKey];
  }

  const hoursOld = s => Math.max(0, (Date.now() - Date.parse(s.publishedAt)) / 36e5);
  const nSources = s => new Set((s.sources||[]).map(x=>x.name)).size;
  // Tabloid outlets show in the feed but never count toward confirming an alert.
  const TABLOIDS = ["cancan"];
  const nConfirming = s => new Set((s.sources||[]).map(x=>x.name).filter(n => !TABLOIDS.some(t => String(n).toLowerCase().includes(t)))).size;
  const trendScore = s => nSources(s)*10 + Math.max(0, 48 - hoursOld(s))/4;
  const ago = s => { const h=hoursOld(s); if (h<1) return t().min(Math.max(1,Math.round(h*60))); if (h<24) return t().hrs(Math.round(h)); return t().days(Math.round(h/24)); };
  const esc = x => String(x??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl = u => /^https:\/\//.test(u||"") ? u : "#";
  const closeness = s => 4 - chain(region).indexOf(s.region||"world");
  const title = s => (lang==="ro" && s.title_ro) || s.title;
  const summary = s => (lang==="ro" && s.summary_ro) || s.summary;
  const placeName = s => (lang==="ro" && s.place_ro) || s.place || t().regions[s.region] || "";
  const empty = (a,b) => `<div class="empty"><strong>${esc(a)}</strong>${esc(b)}</div>`;

  function card(s, lead, star){
    const n = nSources(s);
    return `<article class="story${lead?" lead":""}${star?" starred":""}">
      <div class="meta">${star?`<span class="star" title="${esc(t().important)}" aria-label="${esc(t().important)}">★</span>`:""}<span class="topic">${esc(t().topics[s.topic]||s.topic)}</span><span class="where">${esc(placeName(s))}</span><span>${ago(s)}</span></div>
      <h2>${esc(title(s))}</h2>
      <p>${esc(summary(s))}</p>
      <div class="srcs"><span class="count${n<2?" one":""}">${esc(t().sources(n))}</span>
        ${(s.sources||[]).map(x=>`<a class="src" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.name)} ↗</a>`).join("")}</div>
    </article>`;
  }

  function renderAlert(){
    const box = $("alert");
    if (!$("alerts").checked){ box.hidden = true; return; }
    const today = new Date().toISOString().slice(0,10);
    let seen = {}; try{ seen = JSON.parse(store.get("semnal.seen")||"{}") }catch(e){}
    const shownToday = Object.values(seen).filter(d=>d===today).length;
    if (shownToday >= +$("cap").value){ box.hidden = true; return; }
    const pick = stories
      .filter(s => visibleFor(s,region) || inRegion(s, region==="bucharest"?"romania":region))
      .filter(s => nConfirming(s) >= 2 && hoursOld(s) < 24 && !seen[s.id])
      .sort((a,b)=>trendScore(b)-trendScore(a))[0];
    if (!pick){ box.hidden = true; return; }
    box.innerHTML = `<div class="alert" role="status"><span class="bell">${esc(t().alert)}</span>
      <div><h3>${esc(title(pick))}</h3><p>${esc(t().confirmed(nConfirming(pick)))} · ${ago(pick)}</p></div>
      <button id="dismiss">${esc(t().dismiss)}</button></div>`;
    box.hidden = false;
    $("dismiss").onclick = () => { seen[pick.id] = today; store.set("semnal.seen", JSON.stringify(seen)); renderAlert(); };
  }

  function render(){
    $("chips").innerHTML = TOPICS.map(x => `<button class="chip" data-t="${x}" aria-pressed="${x===topic}">${esc(t().topics[x])}</button>`).join("");
    $("trendtabs").innerHTML = ["romania","europe","world"].map(r=>`<button data-r="${r}" aria-pressed="${r===trendRegion}">${esc(t().regions[r])}</button>`).join("");
    const list = stories
      .filter(s => visibleFor(s, region) && (topic==="all" || s.topic===topic))
      .sort((a,b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));
    // Top 3: most outlets (closer to your region first) among stories from the last 24 h; pinned on top with a star.
    const fresh = list.filter(s => hoursOld(s) < 24);
    const top = (fresh.length >= 3 ? fresh : list).slice()
      .sort((a,b) => (nSources(b)*10 + closeness(b)) - (nSources(a)*10 + closeness(a)) || Date.parse(b.publishedAt) - Date.parse(a.publishedAt))
      .slice(0,3);
    const topIds = new Set(top.map(s=>s.id));
    top.sort((a,b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));
    const ordered = top.concat(list.filter(s => !topIds.has(s.id)));
    $("feedlabel").textContent = `${t().forYou} · ${t().regions[region]}`;
    $("feedcount").textContent = list.length ? t().stories(list.length) : "";
    $("feed").innerHTML = list.length ? ordered.map((s,i)=>card(s,i===0,topIds.has(s.id))).join("")
      : !loaded ? empty(t().loadingT, t().loadingB)
      : stories.length ? empty(t().noTopicT, t().noTopicB) : empty(t().noneT, t().noneB);
    const trend = stories.filter(s=>trendMatch(s,trendRegion) && hoursOld(s)<72).sort((a,b)=>trendScore(b)-trendScore(a)).slice(0,6);
    const max = Math.max(1, ...trend.map(nSources));
    $("trend").innerHTML = trend.length ? trend.map((s,i)=>`<li><span class="rank">${i+1}</span><div>
        <a href="${esc(safeUrl(s.sources?.[0]?.url))}" target="_blank" rel="noopener">${esc(title(s))}</a>
        <div class="heat"><i style="width:${Math.round(nSources(s)/max*100)}%"></i></div>
        <small>${esc(t().sources(nSources(s)))} · ${ago(s)}</small></div></li>`).join("")
      : `<li style="display:block;color:var(--muted)">${esc(t().noTrend(t().regions[trendRegion]))}</li>`;
    renderAlert();
  }

  applyStatic();
  render();

  // Live data: news.json in this repo is rewritten every hour by the automatic collector.
  async function refresh(){
    try{
      const r = await fetch("/news.json?t=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw 0;
      const d = await r.json();
      if (Array.isArray(d.stories) && d.stories.length){ stories = d.stories; loaded = true; }
      if (d.lastRun) lastRun = d.lastRun;
      if (Array.isArray(d.changelog) && d.changelog.length) changelog = d.changelog;
      render(); renderStatus();
    }catch(e){ if (!lastRun){ statusKey = "unavailable"; renderStatus(); } }
  }
  refresh();
  setInterval(refresh, 5*60000);
  setInterval(render, 60000);
})();
</script>

</body></html>
